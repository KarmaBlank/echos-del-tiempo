name: echos_del_tiempo
description: >
  Ecos del Tiempo — co-op JRPG táctico por turnos. Clean Architecture,
  Feature-First, netcode agnóstico (P2P hoy, servidor dedicado / rollback
  a futuro vía la interfaz en lib/netcode/contracts).
publish_to: "none"
version: 0.49.3+180

environment:
  sdk: ">=3.6.0 <4.0.0"

# Pub workspace (docs/specs/monorepo.md § 9, PR 1). La app sigue en la raíz
# hasta el PR 10; los paquetes se suman acá a medida que se crean.
workspace: []

dependencies:
  flutter:
    sdk: flutter

  # --- Motor de juego ---
  flame: ^1.18.0

  # --- Estado / DI ---
  flutter_riverpod: ^2.5.1
  get_it: ^7.7.0
  injectable: ^2.4.4

  # --- Modelos inmutables ---
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # --- Netcode: P2P (implementación actual) ---
  flutter_webrtc: ^0.11.7
  cloud_firestore: ^5.4.4
  firebase_core: ^3.6.0

  cupertino_icons: ^1.0.8
  yaml: ^3.1.2
  material_ui: ^1.11.1
  audioplayers: ^6.8.1
  # Editor (docs/specs/game_editor.md): paquetes de arte (zip) y selector
  # de archivos del área Visuales.
  archive: ^3.6.1
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2
  melos: ^8.10.1

flutter:
  uses-material-design: true
  assets:
    # Notas del parche dentro del juego (docs/specs/title_screen.md § 4).
    - docs/release_notes/
    - assets/sprites/sprite_manifest.yaml
    - assets/sprites/procedural.yaml
    - assets/sprites/npc_variants.yaml
    - assets/sprites/vegetation_presets.yaml
    # Animaciones como datos (docs/specs/game_editor.md § 2.1): una carpeta
    # por categoría de kFxCategories, todas registradas de antemano (el
    # Editor publica ahí sin tocar este archivo; test fx_assets_test).
    - assets/fx/fx_manifest.yaml
    # Layouts como datos (docs/specs/editor_layout.md § 2.2): manifest +
    # un YAML por pantalla en la misma carpeta.
    - assets/layouts/
    - assets/fx/ult/
    - assets/fx/duo/
    - assets/fx/skill/
    - assets/fx/attack/
    - assets/fx/enemy_ult/
    - assets/fx/status/
    - assets/fx/death/
    - assets/fx/proc/
    - assets/fx/map_move/
    - assets/fx/ui/
    # Sonidos como archivo (game_editor.md § 7.6; el Editor publica acá).
    - assets/sfx/
    # Datos de las ULT (docs/specs/ultimates_v2.md § 5.1).
    - assets/data/ults/
    - assets/data/enemy_ults/
    - assets/data/npcs/
    - assets/data/events/
    - assets/data/climate/
    - assets/data/renown/
    # Textos por idioma (docs/specs/i18n.md § 3): locales.json + una
    # carpeta por idioma (no recursivo: cada una listada).
    - assets/i18n/
    - assets/i18n/es-AR/
    - assets/i18n/en/
    - assets/i18n/zh-Hans/
    # Plantillas de BUILD (docs/specs/build_planner_v2.md § 2.2).
    - assets/data/build_templates.yaml
    - assets/data/build_templates_custom.yaml
    # Parche de balance (docs/specs/balance_admin.md).
    - assets/balance/balance.json
    # Los directorios de assets NO son recursivos: cada carpeta de
    # sprites va listada (docs/specs/sprites.md).
    - assets/sprites/characters/guerrero/
    - assets/sprites/characters/maga/
    - assets/sprites/characters/paladin/
    - assets/sprites/characters/tirador/
    - assets/sprites/enemies/slime/
    - assets/sprites/enemies/bat/
    - assets/sprites/enemies/golem/
    - assets/sprites/enemies/ghost/
    - assets/sprites/enemies/reyLimo/
    - assets/sprites/enemies/golemReloj/
    - assets/sprites/enemies/devorador/
    - assets/sprites/enemies/arana/
    - assets/sprites/enemies/lobo/
    - assets/sprites/enemies/murcielagoHielo/
    - assets/sprites/enemies/elementalEscarcha/
    - assets/sprites/enemies/esqueleto/
    - assets/sprites/enemies/caballeroCaido/
    - assets/sprites/enemies/cristalHielo/
    - assets/sprites/enemies/matriarca/
    - assets/sprites/enemies/sierpe/
    - assets/sprites/enemies/caballeroHueco/
    - assets/sprites/enemies/ecoSombra/
    - assets/sprites/enemies/guardianReloj/
    - assets/sprites/enemies/hechicera/
    - assets/sprites/enemies/ecoHechicera/
    - assets/sprites/enemies/salamandra/
    - assets/sprites/enemies/golemMagma/
    - assets/sprites/enemies/bestiaMagma/
    - assets/sprites/enemies/necrofago/
    - assets/sprites/enemies/almaErrante/
    - assets/sprites/enemies/espectroCoronado/
    - assets/sprites/enemies/siervoEspectral/
    - assets/sprites/enemies/vigilanteVacio/
    - assets/sprites/enemies/ojoAbismo/
    - assets/sprites/enemies/centinela/
    - assets/sprites/enemies/heraldoEras/
    - assets/sprites/enemies/fragmentoTiempo/
    - assets/sprites/enemies/devoradorFase2/
    # v0.8 — Jefes del Abismo.
    - assets/sprites/enemies/golemAbismo/
    - assets/sprites/enemies/hechiceraAbismo/
    - assets/sprites/enemies/ecoAbismo/
    - assets/sprites/enemies/espectroAbismo/
    - assets/sprites/enemies/devoradorAbismo/
    - assets/sprites/enemies/devoradorAbismoFase2/
    - assets/sprites/enemies/ecoPrimordial/
    - assets/sprites/effects/
    - assets/sprites/tiles/
    # Editor (game_editor.md § 3.1): lo que hoy se dibuja en código.
    - assets/sprites/items/
    - assets/sprites/ui/

  # Filtro retro CRT (docs/specs/settings.md § 3.2).
  shaders:
    - shaders/crt.frag
    - shaders/crt_overlay.frag

  # Fuente pixel del estilo 8 bits (docs/specs/ui_style.md).
  # Licencia SIL OFL 1.1: assets/fonts/OFL.txt
  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
        # Sin negrita sintética (se ve gorda): un `bold` que se escape usa
        # la misma fuente regular (ui_style.md § "Sin pesos").
        - asset: assets/fonts/PressStart2P-Regular.ttf
          weight: 700
    # Texto de lectura (docs/specs/ui_style.md § "Tipografía"), OFL 1.1:
    # assets/fonts/OFL-VT323.txt.
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
        - asset: assets/fonts/VT323-Regular.ttf
          weight: 700
    # FUENTE DE LECTURA ATKINSON (docs/specs/accessibility.md § 9):
    # Atkinson Hyperlegible (Braille Institute), OFL 1.1:
    # assets/fonts/OFL-AtkinsonHyperlegible.txt. Solo la regular; la
    # misma para 700 (sin negrita sintética, como las otras).
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
          weight: 700

# --- Melos (docs/specs/monorepo.md § 6) -------------------------------------
# Melos 8 lee la configuración de acá (no hay melos.yaml). Correr con
# `dart run melos <cmd>` o `melos <cmd>` si está activado globalmente.
melos:
  repository: https://github.com/KarmaBlank/echos-del-tiempo
  # PR 1: la app sigue en la raíz, así que la raíz es un paquete más.
  useRootAsPackage: true
  scripts:
    analyze:
      description: flutter analyze en cada paquete del workspace.
      exec:
        command: flutter analyze
        concurrency: 1
    format:
      description: Falla si algún archivo no está formateado.
      exec:
        command: dart format --output=none --set-exit-if-changed lib test tool
        concurrency: 1
    format:fix:
      exec:
        command: dart format lib test tool
        concurrency: 1
    test:
      description: Tests de todo el workspace (excluye tool/*_measure_test).
      exec:
        command: flutter test
        concurrency: 1
        failFast: true
      packageFilters: { dirExists: test }
    goldens:update:
      exec:
        command: flutter test --update-goldens --tags golden
        concurrency: 1
      packageFilters: { dirExists: test }
    measure:
      description: Mediciones de economía/progresión (no son tests de CI).
      exec:
        command: flutter test tool/hazanas_economia_measure_test.dart tool/materiales_economia_measure_test.dart tool/progression_v2_measure_test.dart
        concurrency: 1
      packageFilters: { dirExists: tool }
    arch:
      description: Grafo de dependencias (monorepo.md § 3). Stub hasta el PR 2.
      run: dart run tool/check_deps.dart
