schema: 1
id: eult_primordial
category: enemy_ult
name: Todas las Eras
tags: [abismo, a_todos, agua, borra_buffs, eco]
duration: 2600
phases: { build: 1000, release: 1200, recover: 400 }
targets: all
tracks:
  - type: camera
    keys:
      - { t: 0, focus: caster }
      - { t: 1000, focus: targets }
  - type: dim
    keys:
      - { t: 0, v: 0 }
      - { t: 200, v: 0.85 }
      - { t: 2200, v: 0.75 }
      - { t: 2600, v: 0 }
  - type: tint
    color: '#d6ccff'
    keys:
      - { t: 1000, v: 0 }
      - { t: 1250, v: 0.25 }
      - { t: 2100, v: 0 }
  - type: shape
    fire:
      - { t: 0, shape: gather, anchor: caster, ms: 1000, color: element }
  - type: echo
    who: caster
    count: 6
    lag: 70
    alpha: 0.35
    color: echo
    fade: 200
    keys:
      - { t: 200, at: caster, dx: -30 }
      - { t: 1000, at: targets_center, dx: -20, ease: in }
      - { t: 1150, at: targets_center }
  - type: shape
    fire:
      - { t: 1000, shape: ring, anchor: targets_center, color: echo, ms: 700, scale: 3, implode: true }
      - { t: 1550, shape: shockwave, anchor: targets_center, color: white, ms: 500, scale: 3 }
  - type: trail
    each_target: true
    stagger: 90
    fire:
      - { t: 1300, from: sky, to: target, ms: 220, head: meteor, color: element, echoes: 6, lag: 30, ease: in }
  - type: particles
    each_target: true
    stagger: 90
    fire:
      - { t: 1550, preset: burst, anchor: target, count: 4, element: auto }
  - type: flash
    fire:
      - { t: 1545, color: white, alpha: 0.55, ms: 140 }
  - type: hitstop
    fire:
      - { t: 1550, ms: 110 }
  - type: shake
    fire:
      - { t: 1550, amp: 16 }
  - type: impact
    fire:
      - { t: 1550, stagger: 90 }
