schema: 1
id: eult_nido
category: enemy_ult
name: Nido Venenoso
tags: [jefe, a_todos, veneno, eco]
duration: 2200
phases: { build: 800, release: 1000, recover: 400 }
targets: all
tracks:
  - type: camera
    keys:
      - { t: 0, focus: caster }
      - { t: 800, focus: targets }
  - type: dim
    keys:
      - { t: 0, v: 0 }
      - { t: 200, v: 0.85 }
      - { t: 1800, v: 0.75 }
      - { t: 2200, v: 0 }
  - type: tint
    color: '#a6e3a1'
    keys:
      - { t: 800, v: 0 }
      - { t: 1050, v: 0.25 }
      - { t: 1700, v: 0 }
  - type: shape
    fire:
      - { t: 0, shape: gather, anchor: caster, ms: 800, color: element }
  - type: echo
    who: caster
    count: 4
    lag: 80
    alpha: 0.3
    color: echo
    fade: 200
    keys:
      - { t: 150, at: caster }
      - { t: 800, at: caster, dy: -18, ease: out }
      - { t: 1100, at: caster, dy: -10 }
  - type: shape
    each_target: true
    stagger: 90
    fire:
      - { t: 1100, shape: rune_circle, anchor: target, color: element, ms: 420, scale: 0.9 }
  - type: trail
    each_target: true
    stagger: 90
    fire:
      - { t: 800, from: sky, to: target, ms: 300, head: dot, color: element, echoes: 5, lag: 30, ease: in }
  - type: particles
    each_target: true
    stagger: 90
    fire:
      - { t: 1150, preset: burst, anchor: target, count: 2, element: auto }
  - type: flash
    fire:
      - { t: 1145, color: white, alpha: 0.55, ms: 140 }
  - type: hitstop
    fire:
      - { t: 1150, ms: 110 }
  - type: shake
    fire:
      - { t: 1150, amp: 9 }
  - type: impact
    fire:
      - { t: 1150, stagger: 90 }
