schema: 1
id: eult_e_slime
category: enemy_ult
name: Masa Pegajosa
tags: [élite, a_todos, lentitud, eco]
duration: 2000
phases: { build: 750, release: 850, recover: 400 }
targets: all
tracks:
  - type: camera
    keys:
      - { t: 0, focus: caster }
      - { t: 750, focus: targets }
  - type: dim
    keys:
      - { t: 0, v: 0 }
      - { t: 200, v: 0.85 }
      - { t: 1600, v: 0.75 }
      - { t: 2000, v: 0 }
  - type: tint
    color: '#7bed9f'
    keys:
      - { t: 750, v: 0 }
      - { t: 1000, v: 0.25 }
      - { t: 1500, v: 0 }
  - type: shape
    fire:
      - { t: 0, shape: gather, anchor: caster, ms: 750, color: element }
  - type: echo
    who: caster
    count: 3
    lag: 90
    alpha: 0.35
    color: echo
    fade: 200
    keys:
      - { t: 200, at: caster }
      - { t: 950, at: caster, dy: -4 }
  - type: shape
    fire:
      - { t: 750, shape: ring, anchor: caster, color: element, ms: 500, scale: 1.8 }
      - { t: 1000, shape: shockwave, anchor: targets_center, color: '#7bed9f', ms: 420, scale: 2.4 }
  - type: particles
    each_target: true
    stagger: 90
    fire:
      - { t: 1050, preset: burst, anchor: target, count: 2, element: auto }
  - type: flash
    fire:
      - { t: 1045, color: white, alpha: 0.55, ms: 140 }
  - type: hitstop
    fire:
      - { t: 1050, ms: 110 }
  - type: shake
    fire:
      - { t: 1050, amp: 9 }
  - type: impact
    fire:
      - { t: 1050, stagger: 90 }
  # Sonido (game_editor.md § 7.6): la carga y la descarga propias de la ULT.
  - type: sound
    fire:
      - { t: 0, cue: build }
      - { t: 750, cue: release }
