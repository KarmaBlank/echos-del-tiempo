schema: 1
id: eult_abismoEras
category: enemy_ult
name: Última Era
tags: [abismo, a_todos, fuego, borra_buffs, eco]
duration: 2500
phases: { build: 900, release: 1200, recover: 400 }
targets: all
tracks:
  - type: camera
    keys:
      - { t: 0, focus: caster }
      - { t: 900, focus: targets }
  - type: dim
    keys:
      - { t: 0, v: 0 }
      - { t: 200, v: 0.85 }
      - { t: 2100, v: 0.75 }
      - { t: 2500, v: 0 }
  - type: tint
    color: '#ff6b3c'
    keys:
      - { t: 900, v: 0 }
      - { t: 1150, v: 0.25 }
      - { t: 2000, v: 0 }
  - type: shape
    fire:
      - { t: 0, shape: gather, anchor: caster, ms: 900, color: element }
  - type: echo
    who: caster
    count: 2
    lag: 120
    alpha: 0.4
    color: echo
    fade: 200
    keys:
      - { t: 200, at: caster }
      - { t: 1100, at: caster, dy: -4 }
  - type: shape
    fire:
      - { t: 900, shape: sky_crack, anchor: targets_center, color: '#ffb86b', ms: 700, scale: 1.6 }
      - { t: 1150, shape: clock, anchor: targets_center, color: echo, ms: 600, scale: 2 }
  - type: shape
    each_target: true
    stagger: 90
    fire:
      - { t: 1450, shape: pillar, anchor: target, color: element, ms: 400 }
  - type: particles
    each_target: true
    stagger: 90
    fire:
      - { t: 1450, preset: embers, anchor: target, count: 1.4 }
  - type: flash
    fire:
      - { t: 1445, color: white, alpha: 0.55, ms: 140 }
  - type: hitstop
    fire:
      - { t: 1450, ms: 110 }
  - type: shake
    fire:
      - { t: 1450, amp: 14 }
  - type: impact
    fire:
      - { t: 1450, stagger: 90 }
  # Sonido (game_editor.md § 7.6): la carga y la descarga propias de la ULT.
  - type: sound
    fire:
      - { t: 0, cue: build }
      - { t: 900, cue: release }
