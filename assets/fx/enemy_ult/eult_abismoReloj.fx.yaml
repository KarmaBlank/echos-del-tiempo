schema: 1
id: eult_abismoReloj
category: enemy_ult
name: Reloj sin Agujas
tags: [abismo, a_todos, hielo, retraso, eco]
duration: 2400
phases: { build: 850, release: 1150, recover: 400 }
targets: all
tracks:
  - type: camera
    keys:
      - { t: 0, focus: caster }
      - { t: 850, focus: targets }
  - type: dim
    keys:
      - { t: 0, v: 0 }
      - { t: 200, v: 0.85 }
      - { t: 2000, v: 0.75 }
      - { t: 2400, v: 0 }
  - type: tint
    color: '#9fd8ff'
    keys:
      - { t: 850, v: 0 }
      - { t: 1100, v: 0.25 }
      - { t: 1900, v: 0 }
  - type: shape
    fire:
      - { t: 0, shape: clock, anchor: caster, ms: 850, color: element, scale: 1.3 }
  - type: echo
    who: caster
    count: 2
    lag: 120
    alpha: 0.4
    color: echo
    fade: 200
    keys:
      - { t: 200, at: caster }
      - { t: 1050, at: caster, dy: -4 }
  - type: shape
    fire:
      - { t: 850, shape: clock, anchor: targets_center, color: echo, ms: 900, scale: 2.6 }
      - { t: 1350, shape: ring, anchor: targets_center, color: '#d8f0ff', ms: 420, scale: 2.6, implode: true }
  - type: shape
    each_target: true
    stagger: 90
    fire:
      - { t: 1450, shape: shards, anchor: target, color: '#d8f0ff', ms: 320 }
  - type: particles
    each_target: true
    stagger: 90
    fire:
      - { t: 1450, preset: frost, anchor: target, count: 1.4 }
  - type: flash
    fire:
      - { t: 1445, color: white, alpha: 0.55, ms: 140 }
  - type: hitstop
    fire:
      - { t: 1450, ms: 110 }
  - type: shake
    fire:
      - { t: 1450, amp: 9 }
  - type: impact
    fire:
      - { t: 1450, stagger: 90 }
