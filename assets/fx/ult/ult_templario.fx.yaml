    fire:
      - { t: 1300, color: gold, alpha: 0.45, ms: 160 }
  - type: shake
    fire:
      - { t: 1300, amp: 9 }
  - type: hitstop
    fire:
      - { t: 1300, ms: 120 }
  - type: impact
    fire:
      - { t: 1300, stagger: 90 }
  # Sonido (game_editor.md § 7.6): la carga y la descarga propias de la ULT.
  - type: sound
    fire:
      - { t: 0, cue: build }
      - { t: 900, cue: release }
