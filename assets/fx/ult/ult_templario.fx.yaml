      - { t: 200, v: 0.9 }
      - { t: 2000, v: 0.75 }
      - { t: 2400, v: 0 }
  - type: tint
    color: '#ffe8a3'
    keys:
      - { t: 1100, v: 0 }
      - { t: 1300, v: 0.22 }
      - { t: 1900, v: 0 }
