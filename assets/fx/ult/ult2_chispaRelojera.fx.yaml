schema: 1
id: ult2_chispaRelojera
category: ult
name: Chispa Relojera
tags: [varita, a_todos, electro, aliados, eco]
duration: 2200
phases: { build: 800, release: 1000, recover: 400 }
targets: all
tracks:
  - type: camera
    keys:
      - { t: 0, focus: caster }
      - { t: 800, focus: targets }
  - type: dim
    keys:
      - { t: 0, v: 0 }
      - { t: 200, v: 0.85 }
      - { t: 1800, v: 0.75 }
      - { t: 2200, v: 0 }
  - type: tint
    color: '#ffe66d'
    keys:
      - { t: 800, v: 0 }
      - { t: 1050, v: 0.25 }
      - { t: 1700, v: 0 }
  - type: shape
    fire:
      - { t: 0, shape: clock, anchor: caster, ms: 800, color: element, scale: 1.3 }
  - type: echo
    who: caster
    count: 3
    lag: 80
    alpha: 0.45
    color: echo
    fade: 200
    spacing: [-9, -3]
    keys:
      - { t: 200, at: caster }
      - { t: 1000, at: caster, dy: -4 }
  - type: shape
    fire:
      - { t: 800, shape: clock, anchor: targets_center, color: '#ffe66d', ms: 420, scale: 1.6 }
  - type: shape
    each_target: true
    stagger: 90
    fire:
      - { t: 1100, shape: bolt, anchor: target, color: element, ms: 140 }
      - { t: 1220, shape: bolt, anchor: target, color: echo, ms: 120, dx: 8 }
  - type: particles
    each_target: true
    stagger: 90
    fire:
      - { t: 1220, preset: sparks, anchor: target, count: 1.2 }
      - { t: 1220, preset: burst, anchor: target, count: 2, element: auto }
  - type: flash
    fire:
      - { t: 1215, color: white, alpha: 0.55, ms: 140 }
  - type: hitstop
    fire:
      - { t: 1220, ms: 110 }
  - type: shake
    fire:
      - { t: 1100, amp: 3 }
      - { t: 1220, amp: 9 }
  - type: impact
    fire:
      - { t: 1100, pre: true }
      - { t: 1220, stagger: 90 }
