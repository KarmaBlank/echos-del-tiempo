schema: 1
id: ult2_brasaAntigua
category: ult
name: Brasa Antigua
tags: [báculo, a_todos, fuego, catalizador, eco]
duration: 2400
phases: { build: 900, release: 1100, recover: 400 }
targets: all
tracks:
  - type: camera
    keys:
      - { t: 0, focus: caster }
      - { t: 900, focus: targets }
  - type: dim
    keys:
      - { t: 0, v: 0 }
      - { t: 200, v: 0.85 }
      - { t: 2000, v: 0.75 }
      - { t: 2400, v: 0 }
  - type: tint
    color: '#ff8a3c'
    keys:
      - { t: 900, v: 0 }
      - { t: 1150, v: 0.25 }
      - { t: 1900, v: 0 }
  - type: shape
    fire:
      - { t: 0, shape: gather, anchor: caster, ms: 900, color: element }
      - { t: 120, shape: rune_circle, anchor: caster, ms: 780, color: '#ffb86b', scale: 1.1 }
  - type: echo
    who: caster
    count: 3
    lag: 0
    alpha: 0.35
    color: echo
    fade: 200
    spacing: [-10, -4]
    keys:
      - { t: 150, at: caster }
      - { t: 900, at: caster, dy: -18, ease: out }
      - { t: 1200, at: caster, dy: -10 }
  - type: shape
    each_target: true
    stagger: 90
    fire:
      - { t: 900, shape: rune_circle, anchor: target, color: element, ms: 500, scale: 1.1 }
      - { t: 1320, shape: pillar, anchor: target, color: element, ms: 380 }
  - type: particles
    each_target: true
    stagger: 90
    fire:
      - { t: 1320, preset: burst, anchor: target, count: 3, element: auto }
      - { t: 1320, preset: embers, anchor: target, count: 1.4 }
  - type: flash
    fire:
      - { t: 1315, color: white, alpha: 0.55, ms: 140 }
  - type: hitstop
    fire:
      - { t: 1320, ms: 110 }
  - type: shake
    fire:
      - { t: 1320, amp: 9 }
  - type: impact
    fire:
      - { t: 1320, stagger: 90 }
  # Sonido (game_editor.md § 7.6): la carga y la descarga propias de la ULT.
  - type: sound
    fire:
      - { t: 0, cue: build }
      - { t: 900, cue: release }
