schema: 1
id: ult2_telarTiempo
category: ult
name: Telar del Tiempo
tags: [a_todos, veneno, lentitud, eco]
duration: 2200
phases: { build: 800, release: 1000, recover: 400 }
targets: all
tracks:
  - type: camera
    keys:
      - { t: 0, focus: caster }
      - { t: 800, focus: targets }
  - type: dim
    keys:
      - { t: 0, v: 0 }
      - { t: 200, v: 0.85 }
      - { t: 1800, v: 0.75 }
      - { t: 2200, v: 0 }
  - type: tint
    color: '#a6e3a1'
    keys:
      - { t: 800, v: 0 }
      - { t: 1050, v: 0.25 }
      - { t: 1700, v: 0 }
  - type: shape
    fire:
      - { t: 0, shape: gather, anchor: caster, ms: 800, color: element }
  - type: echo
    who: caster
    count: 3
    lag: 90
    alpha: 0.45
    color: echo
    fade: 200
    keys:
      - { t: 200, at: caster }
      - { t: 1000, at: caster, dy: -4 }
  - type: shape
    each_target: true
    stagger: 90
    fire:
      - { t: 1150, shape: rune_circle, anchor: target, color: element, ms: 420, scale: 0.9 }
  - type: trail
    each_target: true
    stagger: 90
    fire:
      - { t: 800, from: caster, to: target, ms: 350, head: dot, color: '#d6ffd0', echoes: 5, lag: 30 }
  - type: particles
    each_target: true
    stagger: 90
    fire:
      - { t: 1200, preset: sparkles, anchor: target, count: 0.8 }
  - type: flash
    fire:
      - { t: 1195, color: white, alpha: 0.55, ms: 140 }
  - type: hitstop
    fire:
      - { t: 1200, ms: 110 }
  - type: shake
    fire:
      - { t: 1200, amp: 9 }
  - type: impact
    fire:
      - { t: 1200, stagger: 90 }
  # Sonido (game_editor.md § 7.6): la carga y la descarga propias de la ULT.
  - type: sound
    fire:
      - { t: 0, cue: build }
      - { t: 800, cue: release }
