schema: 1
id: ult_baculo
category: ult
name: Meteoro
tags: [báculo, maga, a_todos, fuego, eco]
duration: 2600
phases: { build: 900, release: 1300, recover: 400 }
targets: all
tracks:
  - type: camera
    keys:
      - { t: 0, focus: caster }
      - { t: 900, focus: targets }
  - type: dim
    keys:
      - { t: 0, v: 0 }
      - { t: 250, v: 0.9 }
      - { t: 2200, v: 0.8 }
      - { t: 2600, v: 0 }
  - type: tint
    color: '#ff8a3c'
    keys:
      - { t: 900, v: 0 }
      - { t: 1200, v: 0.25 }
      - { t: 2000, v: 0 }
  - type: shape
    fire:
      - { t: 150, shape: rune_circle, anchor: caster, ms: 750, color: element, scale: 1.2 }
      - { t: 950, shape: sky_crack, anchor: targets_center, ms: 500, color: '#ffd29a' }
  - type: echo
    who: caster
    count: 3
    lag: 0
    alpha: 0.35
    color: echo
    spacing: [-10, -4]
    fade: 200
    keys:
      - { t: 250, at: caster }
      - { t: 900, at: caster, dy: -4 }
  - type: trail
    each_target: true
    stagger: 120
    fire:
      - { t: 1100, from: sky, to: target, ms: 250, head: meteor, color: element, scale: 1.4, echoes: 4, lag: 35, ease: in }
  - type: particles
    each_target: true
    stagger: 120
    fire:
      - { t: 1350, preset: burst, anchor: target, element: auto, count: 4 }
      - { t: 1350, preset: debris, anchor: target, count: 0.6 }
      - { t: 1450, preset: embers, anchor: target, count: 1 }
  - type: shape
    each_target: true
    stagger: 120
    fire:
      - { t: 1350, shape: ring, anchor: target, scale: 1.4, color: '#ffb86b', ms: 300 }
  - type: shake
    each_target: true
    stagger: 120
    fire:
      - { t: 1350, amp: 9 }
  - type: flash
    fire:
      - { t: 1700, color: white, alpha: 0.5, ms: 150 }
  - type: hitstop
    fire:
      - { t: 1710, ms: 100 }
  - type: impact
    fire:
      - { t: 1350, stagger: 120 }
