schema: 1
id: ult2_coroPrestado
category: ult
name: Coro Prestado
tags: [mágicas, a_todos, aliados, eco]
duration: 2500
phases: { build: 900, release: 1200, recover: 400 }
targets: all
tracks:
  - type: camera
    keys:
      - { t: 0, focus: caster }
      - { t: 900, focus: targets }
  - type: dim
    keys:
      - { t: 0, v: 0 }
      - { t: 200, v: 0.85 }
      - { t: 2100, v: 0.75 }
      - { t: 2500, v: 0 }
  - type: tint
    color: '#d6ccff'
    keys:
      - { t: 900, v: 0 }
      - { t: 1150, v: 0.25 }
      - { t: 2000, v: 0 }
  - type: shape
    fire:
      - { t: 0, shape: gather, anchor: caster, ms: 900, color: element }
  - type: echo
    who: caster
    count: 4
    lag: 120
    alpha: 0.35
    color: echo
    fade: 200
    spacing: [-12, 0]
    keys:
      - { t: 150, at: caster }
      - { t: 900, at: caster, dy: -18, ease: out }
      - { t: 1200, at: caster, dy: -10 }
  - type: shape
    fire:
      - { t: 900, shape: ring, anchor: allies_center, color: echo, ms: 500, scale: 2 }
      - { t: 1100, shape: ring, anchor: allies_center, color: echo, ms: 500, scale: 2.6 }
      - { t: 1350, shape: shockwave, anchor: targets_center, color: element, ms: 500, scale: 2.6 }
  - type: particles
    each_target: true
    stagger: 90
    fire:
      - { t: 1450, preset: sparkles, anchor: target, count: 1.2 }
  - type: flash
    fire:
      - { t: 1445, color: white, alpha: 0.55, ms: 140 }
  - type: hitstop
    fire:
      - { t: 1450, ms: 110 }
  - type: shake
    fire:
      - { t: 1450, amp: 9 }
  - type: impact
    fire:
      - { t: 1450, stagger: 90 }
