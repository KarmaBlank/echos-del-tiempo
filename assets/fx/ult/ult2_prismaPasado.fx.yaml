schema: 1
id: ult2_prismaPasado
category: ult
name: Prisma del Pasado
tags: [maga, a_todos, detonar, eco]
duration: 2400
phases: { build: 900, release: 1100, recover: 400 }
targets: all
tracks:
  - type: camera
    keys:
      - { t: 0, focus: caster }
      - { t: 900, focus: targets }
  - type: dim
    keys:
      - { t: 0, v: 0 }
      - { t: 200, v: 0.85 }
      - { t: 2000, v: 0.75 }
      - { t: 2400, v: 0 }
  - type: tint
    color: '#ffffff'
    keys:
      - { t: 900, v: 0 }
      - { t: 1150, v: 0.25 }
      - { t: 1900, v: 0 }
  - type: shape
    fire:
      - { t: 0, shape: rune_circle, anchor: caster, ms: 900, color: element }
  - type: echo
    who: caster
    count: 3
    lag: 0
    alpha: 0.35
    color: echo
    fade: 200
    spacing: [-12, -4]
    keys:
      - { t: 150, at: caster }
      - { t: 900, at: caster, dy: -18, ease: out }
      - { t: 1200, at: caster, dy: -10 }
