    each_target: true
    stagger: 90
    fire:
      - { t: 1200, shape: beam, anchor: target, color: '#ff9f43', ms: 240 }
      - { t: 1280, shape: beam, anchor: target, color: '#74b9ff', ms: 240, dx: 6 }
      - { t: 1360, shape: beam, anchor: target, color: '#7bed9f', ms: 240, dx: -6 }
  - type: particles
    each_target: true
    stagger: 90
    fire:
      - { t: 1400, preset: burst, anchor: target, count: 3, element: auto }
  - type: flash
    fire:
      - { t: 1395, color: white, alpha: 0.55, ms: 140 }
  - type: hitstop
    fire:
      - { t: 1400, ms: 110 }
  - type: shake
    fire:
      - { t: 1200, amp: 3 }
      - { t: 1400, amp: 9 }
  - type: impact
    fire:
      - { t: 1200, pre: true }
      - { t: 1400, stagger: 90 }
