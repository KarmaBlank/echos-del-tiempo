schema: 1
id: ult2_relojPartido
category: ult
name: Reloj Partido
tags: [tomo, varita, a_todos, retraso, eco]
duration: 2400
phases: { build: 900, release: 1100, recover: 400 }
targets: all
tracks:
  - type: camera
    keys:
      - { t: 0, focus: caster }
      - { t: 900, focus: targets }
  - type: dim
    keys:
      - { t: 0, v: 0 }
      - { t: 200, v: 0.85 }
      - { t: 2000, v: 0.75 }
      - { t: 2400, v: 0 }
  - type: tint
    color: '#a29bfe'
    keys:
      - { t: 900, v: 0 }
      - { t: 1150, v: 0.25 }
      - { t: 1900, v: 0 }
  - type: shape
    fire:
      - { t: 0, shape: clock, anchor: caster, ms: 900, color: element, scale: 1.3 }
  - type: echo
    who: caster
    count: 5
    lag: 70
    alpha: 0.35
    color: echo
    fade: 200
    keys:
      - { t: 200, at: caster, dx: -30 }
      - { t: 900, at: targets_center, dx: -20, ease: in }
      - { t: 1050, at: targets_center }
  - type: shape
    fire:
      - { t: 900, shape: clock, anchor: targets_center, color: echo, ms: 700, scale: 2 }
      - { t: 1400, shape: sky_crack, anchor: targets_center, color: '#d6ccff', ms: 420 }
      - { t: 1400, shape: ring, anchor: targets_center, color: echo, ms: 420, scale: 2.4, implode: true }
  - type: shape
    each_target: true
    stagger: 90
    fire:
      - { t: 1500, shape: shards, anchor: target, color: echo, ms: 320 }
  - type: particles
    each_target: true
    stagger: 90
    fire:
      - { t: 1500, preset: shards, anchor: target, count: 1 }
  - type: flash
    fire:
      - { t: 1495, color: white, alpha: 0.55, ms: 140 }
  - type: hitstop
    fire:
      - { t: 1500, ms: 110 }
  - type: shake
    fire:
      - { t: 1500, amp: 9 }
  - type: impact
    fire:
      - { t: 1500, stagger: 90 }
