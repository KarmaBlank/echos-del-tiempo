schema: 1
id: ult2_paginaRecuerda
category: ult
name: Página que Recuerda
tags: [tomo, a_todos, hielo, agua, reacción, eco]
duration: 2300
phases: { build: 850, release: 1050, recover: 400 }
targets: all
tracks:
  - type: camera
    keys:
      - { t: 0, focus: caster }
      - { t: 850, focus: targets }
  - type: dim
    keys:
      - { t: 0, v: 0 }
      - { t: 200, v: 0.85 }
      - { t: 1900, v: 0.75 }
      - { t: 2300, v: 0 }
  - type: tint
    color: '#9fd8ff'
    keys:
      - { t: 850, v: 0 }
      - { t: 1100, v: 0.25 }
      - { t: 1800, v: 0 }
  - type: shape
    fire:
      - { t: 0, shape: rune_circle, anchor: caster, ms: 850, color: element }
  - type: echo
    who: caster
    count: 4
    lag: 90
    alpha: 0.35
    color: echo
    fade: 200
    spacing: [-8, -2]
    keys:
      - { t: 150, at: caster }
      - { t: 850, at: caster, dy: -18, ease: out }
      - { t: 1150, at: caster, dy: -10 }
  - type: shape
    fire:
      - { t: 850, shape: rain, anchor: targets_center, color: '#74b9ff', ms: 500, scale: 1.3 }
  - type: shape
    each_target: true
    stagger: 90
    fire:
      - { t: 1230, shape: shards, anchor: target, color: '#d8f0ff', ms: 360 }
  - type: particles
    each_target: true
    stagger: 90
    fire:
      - { t: 1230, preset: frost, anchor: target, count: 1.4 }
      - { t: 1230, preset: burst, anchor: target, count: 2, element: auto }
  - type: flash
    fire:
      - { t: 1225, color: white, alpha: 0.55, ms: 140 }
  - type: hitstop
    fire:
      - { t: 1230, ms: 110 }
  - type: shake
    fire:
      - { t: 1230, amp: 9 }
  - type: impact
    fire:
      - { t: 1230, stagger: 90 }
