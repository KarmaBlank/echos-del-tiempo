schema: 1
id: ult2_diluvioMenor
category: ult
name: Diluvio Menor
tags: [a_todos, veneno, eco]
duration: 2000
phases: { build: 750, release: 850, recover: 400 }
targets: all
tracks:
  - type: camera
    keys:
      - { t: 0, focus: caster }
      - { t: 750, focus: targets }
  - type: dim
    keys:
      - { t: 0, v: 0 }
      - { t: 200, v: 0.85 }
      - { t: 1600, v: 0.75 }
      - { t: 2000, v: 0 }
  - type: tint
    color: '#7bed9f'
    keys:
      - { t: 750, v: 0 }
      - { t: 1000, v: 0.25 }
      - { t: 1500, v: 0 }
  - type: shape
    fire:
      - { t: 0, shape: gather, anchor: caster, ms: 750, color: element }
  - type: echo
    who: caster
    count: 2
    lag: 160
    alpha: 0.35
    color: echo
    fade: 200
    keys:
      - { t: 150, at: caster }
      - { t: 750, at: caster, dy: -18, ease: out }
      - { t: 1050, at: caster, dy: -10 }
  - type: shape
    fire:
      - { t: 750, shape: rain, anchor: targets_center, color: element, ms: 600, scale: 1.4 }
  - type: shape
    each_target: true
    stagger: 90
    fire:
      - { t: 1050, shape: ring, anchor: target, color: element, ms: 280 }
  - type: particles
    each_target: true
    stagger: 90
    fire:
      - { t: 1050, preset: burst, anchor: target, count: 2, element: auto }
  - type: flash
    fire:
      - { t: 1045, color: white, alpha: 0.55, ms: 140 }
  - type: hitstop
    fire:
      - { t: 1050, ms: 110 }
  - type: shake
    fire:
      - { t: 1050, amp: 9 }
  - type: impact
    fire:
      - { t: 1050, stagger: 90 }
