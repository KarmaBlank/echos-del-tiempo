schema: 1
id: ult2_atlasAbierto
category: ult
name: Atlas Abierto
tags: [maga, tirador, a_todos, reacción, eco]
duration: 2500
phases: { build: 900, release: 1200, recover: 400 }
targets: all
tracks:
  - type: camera
    keys:
      - { t: 0, focus: caster }
      - { t: 900, focus: targets }
  - type: dim
    keys:
      - { t: 0, v: 0 }
      - { t: 200, v: 0.85 }
      - { t: 2100, v: 0.75 }
      - { t: 2500, v: 0 }
  - type: tint
    color: '#d6ccff'
    keys:
      - { t: 900, v: 0 }
      - { t: 1150, v: 0.25 }
      - { t: 2000, v: 0 }
  - type: shape
    fire:
      - { t: 0, shape: rune_circle, anchor: caster, ms: 900, color: element }
  - type: echo
    who: caster
    count: 3
    lag: 0
    alpha: 0.35
    color: echo
    fade: 200
    spacing: [-12, -5]
    keys:
      - { t: 150, at: caster }
      - { t: 900, at: caster, dy: -18, ease: out }
      - { t: 1200, at: caster, dy: -10 }
  - type: shape
    fire:
      - { t: 900, shape: sky_crack, anchor: sky_center, color: '#d6ccff', ms: 600 }
  - type: trail
    each_target: true
    stagger: 90
    fire:
      - { t: 1200, from: sky, to: target, ms: 220, head: meteor, color: '#ff8a3c', echoes: 3, lag: 30, ease: in }
      - { t: 1320, from: sky, to: target, ms: 220, head: meteor, color: '#74b9ff', echoes: 3, lag: 30, dx: 6, ease: in }
      - { t: 1440, from: sky, to: target, ms: 220, head: meteor, color: '#7bed9f', echoes: 3, lag: 30, dx: -6, ease: in }
  - type: particles
    each_target: true
    stagger: 90
    fire:
      - { t: 1660, preset: burst, anchor: target, count: 3, element: auto }
  - type: flash
    fire:
      - { t: 1655, color: white, alpha: 0.55, ms: 140 }
  - type: hitstop
    fire:
      - { t: 1660, ms: 110 }
  - type: shake
    fire:
      - { t: 1420, amp: 3 }
      - { t: 1540, amp: 3 }
      - { t: 1660, amp: 9 }
  - type: impact
    fire:
      - { t: 1420, pre: true }
      - { t: 1540, pre: true }
      - { t: 1660, stagger: 90 }
