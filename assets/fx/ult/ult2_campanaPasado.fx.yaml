schema: 1
id: ult2_campanaPasado
category: ult
name: Campana del Pasado
tags: [maza, escudo, a_todos, sagrado, eco]
duration: 2200
phases: { build: 800, release: 1000, recover: 400 }
targets: all
tracks:
  - type: camera
    keys:
      - { t: 0, focus: caster }
      - { t: 800, focus: targets }
  - type: dim
    keys:
      - { t: 0, v: 0 }
      - { t: 200, v: 0.85 }
      - { t: 1800, v: 0.75 }
      - { t: 2200, v: 0 }
  - type: tint
    color: '#fff3b0'
    keys:
      - { t: 800, v: 0 }
      - { t: 1050, v: 0.25 }
      - { t: 1700, v: 0 }
  - type: shape
    fire:
      - { t: 0, shape: gather, anchor: caster, ms: 800, color: element }
  - type: echo
    who: caster
    count: 3
    lag: 150
    alpha: 0.45
    color: gold
    fade: 200
    keys:
      - { t: 150, at: caster }
      - { t: 800, at: caster, dy: -18, ease: out }
      - { t: 1100, at: caster, dy: -10 }
  - type: shape
    fire:
      - { t: 800, shape: ring, anchor: caster, color: gold, ms: 500, scale: 2.2 }
      - { t: 950, shape: ring, anchor: caster, color: echo, ms: 500, scale: 2.6 }
      - { t: 1100, shape: shockwave, anchor: targets_center, color: gold, ms: 420, scale: 2.6 }
  - type: shape
    each_target: true
    stagger: 90
    fire:
      - { t: 1220, shape: cross, anchor: target, color: element, ms: 300 }
  - type: particles
    each_target: true
    stagger: 90
    fire:
      - { t: 1220, preset: sparkles, anchor: target, count: 1.2 }
  - type: flash
    fire:
      - { t: 1215, color: white, alpha: 0.55, ms: 140 }
  - type: hitstop
    fire:
      - { t: 1220, ms: 110 }
  - type: shake
    fire:
      - { t: 1100, amp: 3 }
      - { t: 1220, amp: 9 }
  - type: impact
    fire:
      - { t: 1100, pre: true }
      - { t: 1220, stagger: 90 }
