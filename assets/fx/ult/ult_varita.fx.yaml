schema: 1
id: ult_varita
category: ult
name: Tormenta Arcana
tags: [varita, maga, a_todos, arcano, eco]
duration: 2400
phases: { build: 800, release: 1200, recover: 400 }
targets: all
tracks:
  - type: camera
    keys:
      - { t: 0, focus: caster }
      - { t: 800, focus: targets }
  - type: dim
    keys:
      - { t: 0, v: 0 }
      - { t: 200, v: 0.9 }
      - { t: 2000, v: 0.75 }
      - { t: 2400, v: 0 }
  - type: tint
    color: '#b48cff'
    keys:
      - { t: 800, v: 0 }
      - { t: 1100, v: 0.22 }
      - { t: 1900, v: 0 }
  - type: shape
    fire:
      - { t: 100, shape: rune_circle, anchor: caster, ms: 700, color: element }
      - { t: 850, shape: rune_circle, anchor: sky, ms: 800, color: element, scale: 2 }
      - { t: 1060, shape: bolt, anchor: targets_center, dx: -24, ms: 110, color: echo, alpha: 0.6 }
      - { t: 1180, shape: bolt, anchor: targets_center, dx: 20, ms: 110, color: echo, alpha: 0.6 }
  - type: echo
    who: caster
    count: 4
    lag: 0
    alpha: 0.35
    color: echo
    spacing: [-9, -3]
    fade: 220
    keys:
      - { t: 200, at: caster }
      - { t: 800, at: caster, dy: -6 }
      - { t: 1300, at: caster, dy: -6 }
  - type: shape
    each_target: true
    stagger: 60
    fire:
      - { t: 1330, shape: bolt, anchor: target, ms: 220, color: white }
      - { t: 1350, shape: ring, anchor: target, ms: 300, color: element, scale: 1.3 }
  - type: particles
    each_target: true
    stagger: 60
    fire:
      - { t: 1350, preset: burst, anchor: target, element: arcane, count: 4 }
      - { t: 1350, preset: sparks, anchor: target, count: 1.5 }
  - type: flash
    fire:
      - { t: 1345, color: '#e0d0ff', alpha: 0.5, ms: 140 }
  - type: hitstop
    fire:
      - { t: 1350, ms: 90 }
  - type: shake
    fire:
      - { t: 1060, amp: 3 }
      - { t: 1180, amp: 3 }
      - { t: 1350, amp: 9 }
  - type: impact
    fire:
      - { t: 1350, stagger: 60 }
