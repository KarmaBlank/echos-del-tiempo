      - { t: 1520, ms: 150 }
  - type: shake
    fire:
      - { t: 1200, amp: 3 }
      - { t: 1270, amp: 3 }
      - { t: 1340, amp: 3 }
      - { t: 1410, amp: 3 }
      - { t: 1520, amp: 12 }
  - type: impact
    fire:
      - { t: 1200, pre: true }
      - { t: 1270, pre: true }
      - { t: 1340, pre: true }
      - { t: 1410, pre: true }
      - { t: 1520 }
