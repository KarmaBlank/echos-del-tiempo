parts:
  hat_wide:
    slot: head
    anchor: top
    pivot: [4, 1]
    rows:
      - '..ooooo..'
      - '.oaaaaao.'
      - 'ooAAAAAoo'
  hat_pointy:
    slot: head
    anchor: top
    pivot: [3, 4]
    rows:
      - '...o...'
      - '..oao..'
      - '..oao..'
      - '.oaaao.'
      - 'ooooooo'
  cap:
    slot: head
    anchor: top
    pivot: [3, 1]
    rows:
      - '.ooooo..'
      - 'oCCCCCo.'
      - 'ooooooooo'
  helmet:
    slot: head
    anchor: top
    pivot: [3, 1]
    rows:
      - '.ooooo.'
      - 'oMMaMMo'
      - 'ooooooo'
  hood:
    slot: head
    anchor: top
    pivot: [4, 1]
    rows:
      - '..ooooo..'
      - '.occccco.'
      - 'occCCCcco'
      - 'oco...oco'
      - 'oCo...oCo'
  beard:
    slot: chin
    anchor: chin
    pivot: [2, 1]
    rows:
      - '.hhh.'
      - 'ohhho'
      - '.ooo.'
  scarf:
    slot: neck
    anchor: chin
    pivot: [3, 0]
    rows:
      - 'oaaaaao'
      - '..oAo..'
  backpack:
    slot: back
    anchor: back
    pivot: [4, 0]
    under: true
    rows:
      - 'oooo.'
      - 'oaaAo'
      - 'owwAo'
      - 'oAAAo'
      - 'oooo.'
  lantern:
    slot: hand
    anchor: hand
    pivot: [1, 0]
    rows:
      - '.o.'
      - 'oao'
      - 'oAo'
      - '.o.'
  staff:
    slot: hand
    anchor: hand
    pivot: [0, 5]
    rows:
      - 'o'
      - 'w'
      - 'w'
      - 'w'
      - 'w'
      - 'w'
      - 'w'
      - 'w'
      - 'w'
  pickaxe:
    slot: hand
    anchor: hand
    pivot: [2, 2]
    rows:
      - 'oMMMo'
      - '..w..'
      - '..w..'
      - '..w..'
  magitec_antenna:
    slot: magitec
    anchor: top
    pivot: [0, 3]
    rows:
      - 'g'
      - 'm'
      - 'M'
  magitec_gear:
    slot: magitec
    anchor: back
    pivot: [3, 0]
    under: true
    rows:
      - '.o.o.'
      - 'omMmo'
      - '.MgM.'
      - 'omMmo'
      - '.o.o.'
