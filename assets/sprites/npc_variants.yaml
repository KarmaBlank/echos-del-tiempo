# Variantes procedurales de NPC (docs/specs/npc_variants.md).
# Solo lo lee SpriteCatalog; el Editor (Visuales → VARIANTES NPC) lo reescribe.
#
# bases:    cuerpo base = un sprite de `items:` del manifest + qué color
#           suyo es de qué región (`<región>`, `<región>_dark`, `<región>_light`).
#           Colores sin región (contorno, ojos, metal) no cambian.
# palettes: colores curados por región (hair, skin, clothes, pants, accent).
# parts:    partes en capas: grilla de caracteres anclada a `top`, `chin`,
#           `back` o `hand` (anclas calculadas del cuerpo, no a mano).
#           . vacío  o contorno  h pelo  s piel  c ropa  C ropa oscura
#           p pantalón  a acento  A acento oscuro  m metal  M metal oscuro
#           w madera  g brillo magitec. `under: true` = solo detrás.
# variants: una por NPC; la clave es el id de sprite que usa el juego
#           (`items.vida_<id>` queda de respaldo si la variante falla).
schema: 1
bases:
  aldeano:
    sprite: vida_npc_granjero
    outline: '#1a1420'
    regions:
      '#e0c060': hair
      '#e8b890': skin
      '#6a8a3a': clothes
      '#4a5a8a': pants
      '#8a5a32': accent
  pescador:
    sprite: vida_npc_pescador
    outline: '#1a1420'
    regions:
      '#2a4a7a': hair
      '#e8b890': skin
      '#3a6a9a': clothes
      '#5a4a3a': pants
      '#8a6a3a': accent
  obrero:
    sprite: vida_npc_granjero_trabajo
    outline: '#1a1420'
    regions:
      '#e0c060': hair
      '#e8b890': skin
      '#6a8a3a': clothes
      '#4a5a8a': pants
  minero:
    sprite: vida_npc_brann
    outline: '#0d0d14'
    regions:
      '#4a2a14': hair
      '#d9a07a': skin
      '#a04030': clothes
      '#6b4a2a': accent
      '#3a2a20': pants
      '#2a1a10': pants_dark
  sabio:
    sprite: vida_npc_oren
    outline: '#0d0d14'
    regions:
      '#2e2350': hair
      '#3b2a5a': hair_light
      '#f2c29b': skin
      '#4b3a78': clothes
      '#2a1f45': pants
      '#1a1230': pants_dark
