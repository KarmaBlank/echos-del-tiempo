# Único archivo que tocás para cambiar qué sprite usa cada cosa.
# `SpriteCatalog` (lib/features/*/presentation) lee esto — el código
# nunca referencia un nombre de archivo de sprite directamente.
#
# Los PNG actuales salen de `dart run tool/export_sprites.dart` (puerto
# 1:1 del pixel art del prototipo). Para reemplazarlos por arte hecho a
# mano (Aseprite, Piskel, ...) exportá PNG 1 px por píxel con fondo
# transparente a la misma ruta, o cambiá la ruta acá (y agregá la
# carpeta nueva en pubspec.yaml). Detalle: docs/specs/sprites.md.
#
# Un solo frame `idle` por sprite: caminar, estocada, flash de golpe y
# flotación son animaciones procedurales (ver el spec), no frames.

characters:
  guerrero:
    idle: characters/guerrero/idle.png
  maga:
    idle: characters/maga/idle.png
  paladin:
    idle: characters/paladin/idle.png
  tirador:
    idle: characters/tirador/idle.png
  # v0.5 — Ascensiones (`<clase>_<ascensión>`): misma grilla/tamaño/ancla
  # que el héroe base, se cambian 1:1 por el id de la clase. PNG en la
  # carpeta de la clase base (ya listada en pubspec.yaml).
  guerrero_berserker:
    idle: characters/guerrero/berserker.png
  guerrero_senorGuerra:
    idle: characters/guerrero/senorGuerra.png
  maga_cronomante:
    idle: characters/maga/cronomante.png
  maga_elementalista:
    idle: characters/maga/elementalista.png
  paladin_templario:
    idle: characters/paladin/templario.png
  paladin_guardian:
    idle: characters/paladin/guardian.png
  tirador_francotirador:
    idle: characters/tirador/francotirador.png
  tirador_trampero:
    idle: characters/tirador/trampero.png
  # Overlays de aura opcionales (`aura_<ascensión>`, 24×26, sin contorno):
  # se dibujan DETRÁS del héroe en (-12, -25) respecto de los pies.
  # Ver docs/specs/sprites.md § "Ascensiones".
  aura_berserker:
    idle: characters/guerrero/aura_berserker.png
  aura_senorGuerra:
    idle: characters/guerrero/aura_senorGuerra.png
  aura_cronomante:
    idle: characters/maga/aura_cronomante.png
  aura_elementalista:
    idle: characters/maga/aura_elementalista.png
  aura_templario:
    idle: characters/paladin/aura_templario.png
  aura_guardian:
    idle: characters/paladin/aura_guardian.png
  aura_francotirador:
    idle: characters/tirador/aura_francotirador.png
  aura_trampero:
    idle: characters/tirador/aura_trampero.png

