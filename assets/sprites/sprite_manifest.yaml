    float: true
  # v0.2 — arte propio (tool/export_sprites.dart, misma tubería).
  arana:
    idle: enemies/arana/idle.png
  lobo:
    idle: enemies/lobo/idle.png
  murcielagoHielo:
    idle: enemies/murcielagoHielo/idle.png
    float: true
  elementalEscarcha:
    idle: enemies/elementalEscarcha/idle.png
  esqueleto:
    idle: enemies/esqueleto/idle.png
  caballeroCaido:
    idle: enemies/caballeroCaido/idle.png
  cristalHielo:
    idle: enemies/cristalHielo/idle.png
  matriarca:
    idle: enemies/matriarca/idle.png
    scale: 1.8
  sierpe:
    idle: enemies/sierpe/idle.png
    scale: 1.8
  caballeroHueco:
    idle: enemies/caballeroHueco/idle.png
    scale: 1.7
  # v0.3 — zonas 6–10 (tool/export_sprites.dart, misma tubería).
  ecoSombra:
    idle: enemies/ecoSombra/idle.png
    float: true
  guardianReloj:
    idle: enemies/guardianReloj/idle.png
  hechicera:
    idle: enemies/hechicera/idle.png
    scale: 1.7
  ecoHechicera:
    idle: enemies/ecoHechicera/idle.png
    scale: 1.4
  salamandra:
    idle: enemies/salamandra/idle.png
  golemMagma:
    idle: enemies/golemMagma/idle.png
  bestiaMagma:
    idle: enemies/bestiaMagma/idle.png
    scale: 1.9
  necrofago:
    idle: enemies/necrofago/idle.png
  almaErrante:
    idle: enemies/almaErrante/idle.png
    float: true
  espectroCoronado:
    idle: enemies/espectroCoronado/idle.png
    scale: 1.8
    float: true
  siervoEspectral:
    idle: enemies/siervoEspectral/idle.png
    float: true
  vigilanteVacio:
    idle: enemies/vigilanteVacio/idle.png
  ojoAbismo:
    idle: enemies/ojoAbismo/idle.png
    float: true
  centinela:
    idle: enemies/centinela/idle.png
