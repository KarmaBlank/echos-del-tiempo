# Único archivo que tocás para cambiar qué sprite usa cada cosa.
# `SpriteCatalog` (lib/features/*/presentation) lee esto — el código
# nunca referencia un nombre de archivo de sprite directamente.
#
# Los PNG actuales salen de `dart run tool/export_sprites.dart` (puerto
# 1:1 del pixel art del prototipo). Para reemplazarlos por arte hecho a
# mano (Aseprite, Piskel, ...) exportá PNG 1 px por píxel con fondo
# transparente a la misma ruta, o cambiá la ruta acá (y agregá la
# carpeta nueva en pubspec.yaml). Detalle: docs/specs/sprites.md.
#
# Un solo frame `idle` por sprite: caminar, estocada, flash de golpe y
# flotación son animaciones procedurales (ver el spec), no frames.

characters:
  guerrero:
    idle: characters/guerrero/idle.png
  maga:
    idle: characters/maga/idle.png
  paladin:
    idle: characters/paladin/idle.png
  tirador:
    idle: characters/tirador/idle.png

# `scale`: multiplicador de dibujo (`sc` del prototipo). Por defecto 1.
enemies:
  slime:
    idle: enemies/slime/idle.png
  bat:
    idle: enemies/bat/idle.png
  golem:
    idle: enemies/golem/idle.png
  ghost:
    idle: enemies/ghost/idle.png
  reyLimo:
    idle: enemies/reyLimo/idle.png
    scale: 2
  golemReloj:
    idle: enemies/golemReloj/idle.png
    scale: 2
  devorador:
    idle: enemies/devorador/idle.png
    scale: 2.4
