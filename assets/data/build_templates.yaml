# Plantillas de BUILD v2 (docs/specs/build_planner_v2.md § 2).
#
# 5 por clase: las 2 de siempre, 2 combinaciones con puentes y una "de
# grupo" (clusters de grupo del árbol). Las lee BuildTemplateCatalog; el
# test build_templates_data_test valida todos los ids, los tramos de
# atributos y que el árbol entre en los puntos de cada nivel.
#
# tree: objetivos en orden ("lvl" = desde qué nivel). El camino entre
#   objetivos lo completa el juego; si un objetivo no entra a ese nivel
#   se corre solo al primero en que entra.
# attributes: tramos cerrados de 2 a 50; cada nivel = 1 punto = +3.
# weapons: 1-3 objetivos de arma (priority main / transition / alt).
version: 2
templates:
